<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DaniDev · Design Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Geist', system-ui, sans-serif; }
  /* Each artboard hosts a same-origin iframe of site.html, sized to the artboard. */
  .frame { width: 100%; height: 100%; border: 0; display: block; background: #09090b; }
  .ab-note {
    position: absolute; left: 0; right: 0; bottom: -36px;
    font-family: 'Geist Mono', monospace; font-size: 10.5px;
    color: rgba(60,50,40,0.55); letter-spacing: 0.06em; text-transform: uppercase;
    text-align: left; pointer-events: none;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  const SiteFrame = ({ src, w, h }) => (
    <iframe
      className="frame"
      src={src}
      width={w}
      height={h}
      loading="eager"
      title={src}
    />
  );

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="directions"
          title="Home page — three hero directions"
          subtitle="Same site shell, same copy, same nav and sections below. Variants change only the right-column motif beside the headline. Dark-first · Geist · indigo accent."
        >
          <DCArtboard id="dir-a" label="A · Editorial manifest" width={1440} height={920}>
            <SiteFrame src="site.html?v=a&lang=en" w={1440} h={920} />
          </DCArtboard>
          <DCArtboard id="dir-b" label="B · Transaction graph  ◉ recommended" width={1440} height={920}>
            <SiteFrame src="site.html?v=b&lang=en" w={1440} h={920} />
          </DCArtboard>
          <DCArtboard id="dir-c" label="C · System status panel" width={1440} height={920}>
            <SiteFrame src="site.html?v=c&lang=en" w={1440} h={920} />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="selected"
          title="Selected · Direction B, fully built"
          subtitle="Full page · navbar, hero, experience timeline, expertise grid, footer. Click the EN/ES toggle in the navbar to test the language switch — copy is fully translated, not faked."
        >
          <DCArtboard id="full-desktop" label="Desktop · 1440 · scroll the artboard" width={1440} height={3950}>
            <SiteFrame src="site.html?v=b&lang=en" w={1440} h={3950} />
          </DCArtboard>
          <DCArtboard id="full-mobile" label="Mobile · 390" width={390} height={3200}>
            <SiteFrame src="site.html?v=b&lang=en&device=mobile" w={390} h={3200} />
          </DCArtboard>
          <DCArtboard id="full-mobile-es" label="Mobile · ES" width={390} height={3200}>
            <SiteFrame src="site.html?v=b&lang=es&device=mobile" w={390} h={3200} />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="accents"
          title="Accent color · tweakable"
          subtitle="The right swatch is the chosen direction. The other two preview the accent applied to the hero — flip between them by editing the artboard URL or via the navbar."
        >
          <DCArtboard id="acc-emerald" label="Accent · emerald" width={1440} height={920}>
            <SiteFrame src="site.html?v=b&lang=en&accent=emerald" w={1440} h={920} />
          </DCArtboard>
          <DCArtboard id="acc-cyan" label="Accent · cyan" width={1440} height={920}>
            <SiteFrame src="site.html?v=b&lang=en&accent=cyan" w={1440} h={920} />
          </DCArtboard>
          <DCArtboard id="acc-teal" label="Accent · teal" width={1440} height={920}>
            <SiteFrame src="site.html?v=b&lang=en&accent=teal" w={1440} h={920} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  // Auto-fit once on first mount: no saved viewport state yet → set a zoom
  // that fits the widest section (~4480px world width) into the viewport.
  setTimeout(() => {
    try {
      const k = Object.keys(localStorage).find(k => k.startsWith('dc-vp:'));
      if (k) return; // user already panned/zoomed here, respect it
    } catch (e) {}
    const vw = window.innerWidth;
    const targetWorld = 4700; // 3 × 1440 + gaps + padding
    const scale = Math.max(0.12, Math.min(0.85, (vw - 80) / targetWorld));
    window.postMessage({ type: '__dc_set_zoom', scale }, '*');
  }, 250);
</script>
</body>
</html>
